name: Build and deploy ASP.Net Core app to Azure Web App - PosSaaSApi

on:
  push:
    branches:
      - main
    paths:
      - "PosSaaS.Api/**"
      - ".github/workflows/main_possaasapi.yml"

  workflow_dispatch:

env:
  PROJECT_PATH: PosSaaS.Api/PosSaaS.Api/PosSaaS.Api.csproj
  PUBLISH_PATH: ${{ github.workspace }}/publish

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build API
        run: >
          dotnet build "${{ env.PROJECT_PATH }}"
          --configuration Release
          --no-restore

      - name: Publish API
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          --configuration Release
          --no-build
          --output "${{ env.PUBLISH_PATH }}"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: possaas-api
          path: ${{ env.PUBLISH_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: possaas-api
          path: publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E7249161AA1D41E992FBFEDE1D2883B6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6185C7ECF6D740F9BBDD87A054587497 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_60E745B203CC43EDA26A0661F16115C1 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "PosSaaSApi"
          slot-name: "Production"
          package: publish