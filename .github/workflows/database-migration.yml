name: Database Migration

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Restore dependencies
        run: dotnet restore PosSaaS.Api/PosSaaS.Api/PosSaaS.Api.csproj

      - name: Build backend
        run: dotnet build PosSaaS.Api/PosSaaS.Api/PosSaaS.Api.csproj --configuration Release --no-restore

      - name: Apply EF Core migrations
        working-directory: PosSaaS.Api/PosSaaS.Api
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.POSSAAS_PROD_CONNECTION_STRING }}
        run: dotnet ef database update --configuration Release --no-build