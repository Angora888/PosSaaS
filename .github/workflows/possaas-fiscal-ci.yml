name: POS SaaS fiscal foundations CI

on:
  push:
    branches: [main]
    paths:
      - 'PosSaaS.Api/**'
      - 'PosSaaS.Web/**'
      - 'tests/PosSaaS.FiscalSmoke/**'
      - 'scripts/install-hacienda-xsd.sh'
      - 'scripts/install-xmldsig-schema.sh'
      - '.github/workflows/possaas-fiscal-ci.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore API
        run: dotnet restore PosSaaS.Api/PosSaaS.Api/PosSaaS.Api.csproj
      - name: Compile API
        run: dotnet build PosSaaS.Api/PosSaaS.Api/PosSaaS.Api.csproj --configuration Release --no-restore
      - name: Restore verified fiscal schema cache
        id: schema-cache
        uses: actions/cache/restore@v4
        with:
          path: PosSaaS.Api/PosSaaS.Api/FiscalSchemas/v4.4/*.xsd
          key: possaas-fiscal-v44-d384afef-cda1c7dd-w3c-v1
      - name: Try installing SHA-256 verified Hacienda XSD 4.4
        if: steps.schema-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if bash scripts/install-hacienda-xsd.sh && bash scripts/install-xmldsig-schema.sh; then
            echo "Official 4.4 XSD downloaded and verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "XSD currently unavailable: preview validation remains disabled. Build proceeds safely." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fiscal smoke checks
        run: dotnet run --project tests/PosSaaS.FiscalSmoke/PosSaaS.FiscalSmoke.csproj --configuration Release
  official-xsd-availability:
    # Download-and-cache only after ALL official XSD + W3C dependencies succeed.
    # This is a diagnostic and never enables issuance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned fiscal schema cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: PosSaaS.Api/PosSaaS.Api/FiscalSchemas/v4.4/*.xsd
          key: possaas-fiscal-v44-d384afef-cda1c7dd-w3c-v1
      - name: Download and verify all fiscal schemas
        id: download
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if bash scripts/install-hacienda-xsd.sh && bash scripts/install-xmldsig-schema.sh; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
            echo "Official Hacienda XSD + W3C dependency installed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
            echo "Hacienda or W3C not available; no fiscal schema cache created." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Cache verified official schemas
        if: steps.download.outputs.installed == 'true'
        uses: actions/cache/save@v4
        with:
          path: PosSaaS.Api/PosSaaS.Api/FiscalSchemas/v4.4/*.xsd
          key: possaas-fiscal-v44-d384afef-cda1c7dd-w3c-v1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PosSaaS.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: PosSaaS.Web/package-lock.json
      - run: npm ci
      - run: npm run build
