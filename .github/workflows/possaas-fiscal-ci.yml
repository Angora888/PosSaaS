name: POS SaaS fiscal foundations CI

on:
  push:
    branches: [main]
    paths:
      - 'PosSaaS.Api/**'
      - 'PosSaaS.Web/**'
      - 'tests/PosSaaS.FiscalSmoke/**'
      - 'scripts/install-hacienda-xsd.sh'
      - '.github/workflows/possaas-fiscal-ci.yml'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore API
        run: dotnet restore PosSaaS.Api/PosSaaS.Api/PosSaaS.Api.csproj
      - name: Compile API
        run: dotnet build PosSaaS.Api/PosSaaS.Api/PosSaaS.Api.csproj --configuration Release --no-restore
      - name: Try installing SHA-256 verified Hacienda XSD 4.4
        shell: bash
        run: |
          if bash scripts/install-hacienda-xsd.sh; then
            echo "Official 4.4 XSD downloaded and verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "XSD currently unavailable: preview validation remains disabled. Build proceeds safely." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fiscal smoke checks
        run: dotnet run --project tests/PosSaaS.FiscalSmoke/PosSaaS.FiscalSmoke.csproj --configuration Release
  official-xsd-availability:
    # External Hacienda downloads must not hide compile/test results.
    # This is a diagnostic, not evidence that XSD is published in Azure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe official 4.4 XSD download
        shell: bash
        run: |
          set -euo pipefail
          if bash scripts/install-hacienda-xsd.sh; then
            echo "Official Hacienda XSD download and basic structure check: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Hacienda XSD could not be downloaded or verified; no emission enabled." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PosSaaS.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: PosSaaS.Web/package-lock.json
      - run: npm ci
      - run: npm run build
